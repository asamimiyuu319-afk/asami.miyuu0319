<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Portfolio</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px;
      font-family: Arial, sans-serif;
      color: #111;
      background: #fff;
      overflow-x: hidden;
    }

    header {
      margin-bottom: 30px;
    }

    h1 {
      font-size: 200px;
      font-weight: normal;
      margin: 0;
    }

    h2 {
      font-size: 100px;
      font-weight: normal;
      margin: 20 20 20;
    }

    h3 {
      font-size: 50px;
      font-weight: normal;
      margin: 0 0 30px;
    }

    section {
      margin-bottom: 120px;
    }

    /* Works */

    .works {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 30px;
      width: 100%;
    }

    .works img {
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      display: block;
    }

    /* Music */

    .music {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 50px 30px;
      width: 100%;
    }

    .song {
      min-width: 0;
    }

    .song img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
    }

    .song p {
      margin: 12px 0 8px;
    }

    .song audio {
      width: 100%;
    }

    /* About / Contact */

    #about {
      margin-top: 150px;
    }

    #contact {
      margin-top: 100px;
    }

  </style>
</head>
