<!DOCTYPE html>

  <title>Portfolio</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px;
      font-family: Arial, sans-serif;
      color: #111;
      background: #fff;
      overflow-x: hidden;
      text-align: left;
    }

    header, section {
      margin-top: 0;
      margin-bottom: 30px;
    }

    h1, h2, h3, p {
      margin: 0 0 30px;
      font-weight: normal;
      text-align: left;
    }

    h1 { font-size: 40px; }
    h2 { font-size: 28px; }
    h3 { font-size: 20px; }
    p { font-size: 16px; }

    .works {
      display: grid;
      grid-template-columns: repeat(1, minmax(0, 1fr));
      gap: 30px;
      width: 100%;
    }

    @media (min-width: 768px) {
      .works {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    .works img, .song img {
      width: 100%;
      height: auto;
      display: block;
    }

    .works img {
      aspect-ratio: 3 / 4;
      object-fit: cover;
    }

    .music {
      display: grid;
      grid-template-columns: repeat(1, minmax(0, 1fr));
      gap: 30px;
      width: 100%;
    }

    @media (min-width: 768px) {
      .music {
        max-width: 500px;
      }
    }

    .song {
      width: 100%;
      margin-bottom: 10px;
    }

    .song img {
      aspect-ratio: 1 / 1;
      object-fit: cover;
      margin-bottom: 15px;
    }

    .song p {
      margin: 0 0 10px;
    }

    .song audio {
      width: 100%;
      display: block;
    }
  </style>
</head>
